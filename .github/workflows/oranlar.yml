name: Resmî oranları güncelle
on:
  schedule:
    - cron: '5,35 7 * * *'   # TSİ 10:05 ve 10:35
    - cron: '5 10,13,16 * * *' # TSİ 13:05, 16:05 ve 19:05
  push:
    paths:
      - 'scripts/oran_guncelle.py'
      - '.github/workflows/oranlar.yml'
  workflow_dispatch:
    inputs:
      gun:
        description: 'Resmî Gazete taramasının bitiş günü (YYYY-AA-GG, boşsa bugün)'
        required: false
      geri:
        description: 'Kaç gün geriye taransın'
        required: false
        default: '7'
permissions:
  contents: write
concurrency: oranlar
jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null || true
          pip install pypdf
      - name: Oranları çek
        env:
          TUIK_API_KEY: ${{ secrets.TUIK_API_KEY }}
          SCAN_DAY: ${{ github.event.inputs.gun }}
          SCAN_BACK: ${{ github.event.inputs.geri }}
        run: |
          args=()
          if [ -n "$SCAN_DAY" ]; then args+=(--gun "$SCAN_DAY"); fi
          if [ -n "$SCAN_BACK" ]; then args+=(--geri "$SCAN_BACK"); fi
          python scripts/oran_guncelle.py "${args[@]}"
      - name: Değiştiyse kaydet
        run: |
          git config user.name "oran-guncelleme"
          git config user.email "actions@users.noreply.github.com"
          git add data/oranlar.json
          git diff --cached --quiet || git commit -m "Resmî oranlar güncellendi ($(date -u +%F))"
          git pull --rebase origin main && git push
