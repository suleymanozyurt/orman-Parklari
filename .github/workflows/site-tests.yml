name: Site and calculation regression tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  site-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
