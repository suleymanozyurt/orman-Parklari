name: probe (gecici)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          curl -sS -m 30 https://databrowser2.tuik.gov.tr/ > db.html
          echo "== scripts"; grep -o 'src="[^"]*"' db.html | head -20
          curl -sS -m 30 https://databrowser2.tuik.gov.tr/utils.js | head -c 1500; echo
          for p in settings.json api/config assets/settings.json config/settings.json; do echo "== $p"; curl -sS -m 20 -o x -w "%{http_code}\n" https://databrowser2.tuik.gov.tr/$p; head -c 800 x; echo; done
          grep -o 'https\?://[a-zA-Z0-9./_-]*' db.html | sort -u | head -30
