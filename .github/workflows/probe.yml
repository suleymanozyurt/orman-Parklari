name: probe (gecici)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          curl -sS -m 60 https://databrowser2.tuik.gov.tr/static/js/main.92a07347.js > m.js; ls -la m.js
          echo "== urls"; grep -o 'https\?://[a-zA-Z0-9.:-]*[a-zA-Z0-9./_-]*' m.js | sort -u | grep -v 'w3.org\|reactjs\|github\|mozilla\|npmjs\|fb.me' | head -40
          echo "== paths"; grep -o '"/[a-zA-Z]*[Aa]pi[a-zA-Z/]*[^"]\{0,60\}"\|"\./[a-zA-Z/_.-]*\.json"\|"/[a-z-]*/rest[^"]\{0,60\}"' m.js | sort -u | head -40
